
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>life of charrito</title>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 70px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            color: #aaa;
        }

        /* Contenedor de la imagen */
        .contenedor-imagen {
            width: 80%;
            max-width: 600px;
            height: 350px;
            margin-top: 30px;
            border-radius: 20px;
            overflow: hidden;
            background-color: #222;
        }

        /* Imagen dentro del contenedor */
        .contenedor-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <!-- Primera sección -->
    <section>
        <h1>Life of Charrito</h1>
        <p>desliza↓</p>
    </section>

    <!-- Segunda sección con imagen -->
    <section>
        <h1>Este es Charrito</h1>
        <p>Un heroe que combate las addiciones</p>


        <div class="contenedor-imagen">
            <img src="assets/charrito.jpeg">
        </div>
    </section>

    <!-- Tercera sección -->
    <section>
        <h1>NOO NO PUEDE SER</h1>
        <p>a charrito le encontraron nexos con el clan del golfo</p>
        <p>esta preso en la carcel de Sincelejo</p>
    </section>

</body>
</html>
